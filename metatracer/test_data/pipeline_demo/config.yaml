# Run from this directory with: snakemake --cores 4

reads: reads/reads_40.fastq
reads_format: fastq

# Add every MetaTracer index that should be searched. Assignment runs once per
# entry and the resulting files are merged before annotation.
indices:
  - /path/to/reference/indices/metatracer_reference.index.0.index

# Add the sequence-manifest TSV associated with each index build. These are the
# files produced by `metatracer reference-build --map-out`.
map_tables:
  - /path/to/reference/metatracer_reference.map.tsv

# Full annotation uses GFF/protein files and eggNOG. Set taxa_only to true to
# skip those lookups. reference_basepath should contain
# ncbi_dataset/data/<accession>/ directories when taxa_only is false.
taxa_only: false
reference_basepath: /path/to/downloads/package

# eggNOG-mapper does not bundle its databases. The workflow downloads the core
# annotation and DIAMOND databases here when they are not already present.
eggnog_data_dir: /path/to/eggnog_data
eggnog_downloader: download_eggnog_data.py

threads: 4
output_dir: results

# Repeat values here to count joint combinations, for example [taxid, eggnog_OG].
# Rows blank in any selected column are not counted.
count_columns:
  - taxid
