# Plain text file with one NCBI assembly accession per line.
accession_file: "accessions.txt"

# The dehydrated ZIP, extracted package, and logs are written here.
output_dir: "downloads"

# Use "genome,gff3,protein" when annotations and proteins are also needed.
include: "genome,gff3,protein"

rehydrate_workers: 8

# Reference planning and MTSv index construction.
max_index_size_mb: 10000
bwt_occ_sample_rate: 64
sa_sample_rate: 32
index_threads: 4
skip_missing: false
