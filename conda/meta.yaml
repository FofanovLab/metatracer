{% set name = "metatracer" %}
{% set version = "0.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  path: ..

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=64
    - wheel
  run:
    - python >=3.9
    - mtsv-tools >=2.2.0
    - click >=8.1
    - biopython >=1.80
    - pysam >=0.21
    - intervaltree >=3.1
    - ete3 >=3.1
    - eggnog-mapper
    - tqdm >=4.64
    - htslib

test:
  imports:
    - metatracer
  commands:
    - metatracer --help
  requires:
    - pytest

about:
  home: https://github.com/FofanovLab/metatracer
  summary: MetaTracer metatranscriptomic analysis pipeline
  license: MIT
  license_file: LICENSE
